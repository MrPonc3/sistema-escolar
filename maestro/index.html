<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vista Maestro — Intervención</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
    }

    header {
      background: white;
      border-bottom: 1px solid #e2e8f0;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 { font-size: 1.1rem; color: #1a202c; }
    header span { font-size: 0.85rem; color: #718096; }

    .btn-salir {
      background: none;
      border: 1px solid #cbd5e0;
      padding: 0.4rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      color: #4a5568;
    }

    .btn-salir:hover { background: #f7fafc; }

    main {
      max-width: 800px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 1px 6px rgba(0,0,0,0.08);
      margin-bottom: 1.5rem;
    }

    .card h2 {
      font-size: 1rem;
      color: #2d3748;
      margin-bottom: 1.25rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid #edf2f7;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .form-group { display: flex; flex-direction: column; gap: 0.4rem; }

    label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #4a5568;
    }

    select, input {
      padding: 0.6rem 0.75rem;
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      font-size: 0.95rem;
      background: white;
      outline: none;
    }

    select:focus, input:focus { border-color: #4299e1; }

    .estado-btns {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .estado-btn {
      padding: 0.5rem 1.25rem;
      border-radius: 8px;
      border: 2px solid #cbd5e0;
      background: white;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.15s;
      color: #4a5568;
    }

    .estado-btn.peligro.active  { border-color: #ed8936; background: #fffaf0; color: #c05621; }
    .estado-btn.reprobando.active { border-color: #e53e3e; background: #fff5f5; color: #c53030; }
    .estado-btn.felicitacion.active { border-color: #48bb78; background: #f0fff4; color: #276749; }

    .btn-reportar {
      width: 100%;
      padding: 0.75rem;
      background: #3182ce;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.5rem;
    }

    .btn-reportar:hover { background: #2b6cb0; }
    .btn-reportar:disabled { background: #a0aec0; cursor: not-allowed; }

    .tabla-wrapper { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    th {
      text-align: left;
      padding: 0.6rem 0.75rem;
      background: #f7fafc;
      color: #4a5568;
      font-size: 0.8rem;
      font-weight: 600;
      border-bottom: 1px solid #e2e8f0;
    }

    td {
      padding: 0.65rem 0.75rem;
      border-bottom: 1px solid #edf2f7;
      color: #2d3748;
    }

    .badge {
      padding: 0.25rem 0.65rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .badge.peligro    { background: #fffaf0; color: #c05621; border: 1px solid #ed8936; }
    .badge.reprobando { background: #fff5f5; color: #c53030; border: 1px solid #e53e3e; }
    .badge.felicitacion { background: #f0fff4; color: #276749; border: 1px solid #48bb78; }

    .empty {
      text-align: center;
      padding: 2rem;
      color: #a0aec0;
      font-size: 0.9rem;
    }

    .alert {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      margin-bottom: 1rem;
      display: none;
    }

    .alert.success { background: #f0fff4; color: #276749; border: 1px solid #48bb78; }
    .alert.error   { background: #fff5f5; color: #c53030; border: 1px solid #e53e3e; }
  </style>
</head>
<body>

<header>
  <div>
    <h1>🏫 Sistema de Intervención</h1>
    <span>Vista: Maestro</span>
  </div>
  <div style="display:flex; align-items:center; gap:1rem;">
    <span id="nombre-usuario" style="font-size:0.85rem; color:#4a5568;"></span>
    <button class="btn-salir" onclick="cerrarSesion()">Cerrar sesión</button>
  </div>
</header>

<main>
  <div class="alert" id="alerta"></div>

  <div class="card">
    <h2>📋 Reportar alumno</h2>

    <div class="form-row">
      <div class="form-group">
        <label>Grado</label>
        <select id="grado">
          <option value="">— Selecciona grado —</option>
          <option>1° A</option><option>1° B</option><option>1° C</option>
          <option>2° A</option><option>2° B</option><option>2° C</option>
          <option>3° A</option><option>3° B</option><option>3° C</option>
        </select>
      </div>
      <div class="form-group">
        <label>Materia</label>
        <select id="materia">
          <option value="">— Selecciona materia —</option>
          <option>Matemáticas</option>
          <option>Español</option>
          <option>Ciencias</option>
          <option>Historia</option>
          <option>Inglés</option>
          <option>Educación Física</option>
        </select>
      </div>
    </div>

    <div class="form-group" style="margin-bottom:1rem;">
      <label>Nombre del alumno</label>
      <input type="text" id="alumno" placeholder="Nombre completo del alumno">
    </div>

    <div class="form-group" style="margin-bottom:1.25rem;">
      <label>Estado</label>
      <div class="estado-btns">
        <button class="estado-btn peligro"      onclick="seleccionarEstado(this,'peligro')">⚠️ En peligro de reprobar</button>
        <button class="estado-btn reprobando"   onclick="seleccionarEstado(this,'reprobando')">🔴 Reprobando</button>
        <button class="estado-btn felicitacion" onclick="seleccionarEstado(this,'felicitacion')">🌟 Felicitación</button>
      </div>
    </div>

    <div class="form-group" style="margin-bottom:1rem;">
      <label>Observaciones (opcional)</label>
      <input type="text" id="observaciones" placeholder="Ej. Falta de entrega de tareas, buen desempeño en exámenes...">
    </div>

    <button class="btn-reportar" onclick="agregarReporte()">Guardar reporte</button>
  </div>

  <div class="card">
    <h2>📁 Mis reportes de esta sesión</h2>
    <div class="tabla-wrapper">
      <table>
        <thead>
          <tr>
            <th>Alumno</th>
            <th>Grado</th>
            <th>Materia</th>
            <th>Estado</th>
            <th>Observaciones</th>
          </tr>
        </thead>
        <tbody id="tabla-reportes">
          <tr><td colspan="5" class="empty">Aún no has agregado reportes en esta sesión.</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<script>
  // Verificar sesión
  const usuario = sessionStorage.getItem('usuario');
  const rol     = sessionStorage.getItem('rol');
  if (!usuario || rol !== 'maestro') window.location.href = '../index.html';
  document.getElementById('nombre-usuario').textContent = usuario;

  let estadoSeleccionado = '';
  let reportes = [];

  function seleccionarEstado(btn, estado) {
    document.querySelectorAll('.estado-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    estadoSeleccionado = estado;
  }

  function mostrarAlerta(msg, tipo) {
    const a = document.getElementById('alerta');
    a.textContent = msg;
    a.className = `alert ${tipo}`;
    a.style.display = 'block';
    setTimeout(() => a.style.display = 'none', 3000);
  }

  function agregarReporte() {
    const grado   = document.getElementById('grado').value;
    const materia = document.getElementById('materia').value;
    const alumno  = document.getElementById('alumno').value.trim();
    const obs     = document.getElementById('observaciones').value.trim();

    if (!grado || !materia || !alumno || !estadoSeleccionado) {
      mostrarAlerta('Por favor completa todos los campos obligatorios.', 'error');
      return;
    }

    reportes.push({ alumno, grado, materia, estado: estadoSeleccionado, obs });
    renderTabla();
    limpiarFormulario();
    mostrarAlerta('Reporte guardado correctamente.', 'success');
  }

  function renderTabla() {
    const tbody = document.getElementById('tabla-reportes');
    if (reportes.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" class="empty">Aún no has agregado reportes en esta sesión.</td></tr>';
      return;
    }
    const etiquetas = { peligro: '⚠️ En peligro', reprobando: '🔴 Reprobando', felicitacion: '🌟 Felicitación' };
    tbody.innerHTML = reportes.map(r => `
      <tr>
        <td>${r.alumno}</td>
        <td>${r.grado}</td>
        <td>${r.materia}</td>
        <td><span class="badge ${r.estado}">${etiquetas[r.estado]}</span></td>
        <td>${r.obs || '—'}</td>
      </tr>
    `).join('');
  }

  function limpiarFormulario() {
    document.getElementById('alumno').value = '';
    document.getElementById('observaciones').value = '';
    document.getElementById('grado').value = '';
    document.getElementById('materia').value = '';
    document.querySelectorAll('.estado-btn').forEach(b => b.classList.remove('active'));
    estadoSeleccionado = '';
  }

  function cerrarSesion() {
    sessionStorage.clear();
    window.location.href = '../index.html';
  }
</script>
</body>
</html>
