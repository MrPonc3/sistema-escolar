<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de Evaluación</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; min-height: 100vh; }

    header {
      background: white; border-bottom: 1px solid #e2e8f0;
      padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center;
    }
    header h1 { font-size: 1.1rem; color: #1a202c; }
    .btn-salir {
      background: none; border: 1px solid #cbd5e0;
      padding: 0.4rem 1rem; border-radius: 6px;
      cursor: pointer; font-size: 0.85rem; color: #4a5568;
    }

    main { max-width: 740px; margin: 2rem auto; padding: 0 1rem; }

    /* Progreso */
    .progreso-wrapper { margin-bottom: 1.5rem; }
    .progreso-info {
      display: flex; justify-content: space-between;
      font-size: 0.82rem; color: #718096; margin-bottom: 0.4rem;
    }
    .progreso-barra {
      height: 6px; background: #e2e8f0; border-radius: 10px; overflow: hidden;
    }
    .progreso-fill {
      height: 100%; background: #3182ce; border-radius: 10px;
      transition: width 0.4s ease;
    }

    /* Card materia */
    .card {
      background: white; border-radius: 14px; padding: 1.75rem;
      box-shadow: 0 1px 6px rgba(0,0,0,0.08); margin-bottom: 1.5rem;
    }
    .card-header {
      display: flex; align-items: flex-start; gap: 1rem;
      margin-bottom: 1.5rem; padding-bottom: 1rem;
      border-bottom: 1px solid #edf2f7;
    }
    .materia-icono {
      width: 44px; height: 44px; border-radius: 10px;
      background: #ebf8ff; display: flex; align-items: center;
      justify-content: center; font-size: 1.3rem; flex-shrink: 0;
    }
    .materia-info h2 { font-size: 1.1rem; color: #1a202c; margin-bottom: 0.2rem; }
    .materia-info p  { font-size: 0.85rem; color: #718096; }

    /* Preguntas */
    .pregunta { margin-bottom: 1.5rem; }
    .pregunta:last-of-type { margin-bottom: 0; }
    .pregunta-texto {
      font-size: 0.92rem; color: #2d3748; margin-bottom: 0.75rem;
      line-height: 1.5;
    }
    .pregunta-numero {
      font-size: 0.75rem; font-weight: 700; color: #a0aec0;
      text-transform: uppercase; letter-spacing: 0.05em;
      margin-bottom: 0.3rem;
    }
    .categoria-label {
      display: inline-block; font-size: 0.72rem; font-weight: 600;
      padding: 0.15rem 0.6rem; border-radius: 20px; margin-bottom: 0.5rem;
    }
    .categoria-label.claridad   { background: #ebf8ff; color: #2b6cb0; }
    .categoria-label.ambiente   { background: #f0fff4; color: #276749; }
    .categoria-label.engagement { background: #fffaf0; color: #c05621; }

    /* Escala 1-5 */
    .escala {
      display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap;
    }
    .escala-extremo {
      font-size: 0.75rem; color: #a0aec0; white-space: nowrap;
    }
    .escala-btns { display: flex; gap: 0.4rem; }
    .escala-btn {
      width: 42px; height: 42px; border-radius: 8px;
      border: 1.5px solid #e2e8f0; background: white;
      cursor: pointer; font-size: 0.95rem; font-weight: 600;
      color: #4a5568; transition: all 0.15s; display: flex;
      align-items: center; justify-content: center;
    }
    .escala-btn:hover { border-color: #4299e1; background: #ebf8ff; color: #2b6cb0; }
    .escala-btn.selected { border-color: #3182ce; background: #3182ce; color: white; }

    /* Comentario */
    .comentario-section { margin-top: 1.25rem; padding-top: 1.25rem; border-top: 1px solid #edf2f7; }
    .comentario-section label { font-size: 0.85rem; font-weight: 600; color: #4a5568; display: block; margin-bottom: 0.5rem; }
    .comentario-section textarea {
      width: 100%; padding: 0.75rem; border: 1px solid #cbd5e0;
      border-radius: 8px; font-size: 0.9rem; font-family: inherit;
      resize: vertical; min-height: 80px; outline: none;
    }
    .comentario-section textarea:focus { border-color: #4299e1; }

    /* Navegación */
    .nav-btns {
      display: flex; justify-content: space-between;
      align-items: center; margin-top: 1.5rem; gap: 1rem;
    }
    .btn-anterior {
      padding: 0.7rem 1.5rem; background: none;
      border: 1px solid #cbd5e0; border-radius: 8px;
      cursor: pointer; font-size: 0.9rem; color: #4a5568;
    }
    .btn-anterior:hover { background: #f7fafc; }
    .btn-siguiente {
      padding: 0.7rem 1.75rem; background: #3182ce; color: white;
      border: none; border-radius: 8px; cursor: pointer;
      font-size: 0.9rem; font-weight: 600;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .btn-siguiente:hover { background: #2b6cb0; }
    .btn-siguiente:disabled { background: #a0aec0; cursor: not-allowed; }
    .btn-enviar {
      padding: 0.7rem 1.75rem; background: #38a169; color: white;
      border: none; border-radius: 8px; cursor: pointer;
      font-size: 0.9rem; font-weight: 600;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .btn-enviar:hover { background: #2f855a; }
    .btn-enviar:disabled { background: #a0aec0; cursor: not-allowed; }

    /* Nota privacidad inline */
    .nota-inline {
      background: #f0fff4; border: 1px solid #9ae6b4;
      border-radius: 8px; padding: 0.65rem 1rem;
      font-size: 0.8rem; color: #276749; margin-bottom: 1.5rem;
    }

    /* Pantalla de éxito */
    .exito {
      text-align: center; padding: 3rem 1rem;
    }
    .exito .icono { font-size: 4rem; margin-bottom: 1rem; }
    .exito h2 { font-size: 1.4rem; color: #1a202c; margin-bottom: 0.5rem; }
    .exito p  { color: #718096; margin-bottom: 1.5rem; font-size: 0.95rem; }
    .btn-volver {
      padding: 0.75rem 2rem; background: #3182ce; color: white;
      border: none; border-radius: 8px; cursor: pointer;
      font-size: 1rem; font-weight: 600;
    }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: white; border-radius: 50%;
      animation: spin 0.7s linear infinite; display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .cargando { text-align: center; padding: 3rem; color: #718096; }
  </style>
</head>
<body>

<header>
  <div>
    <h1>📝 Evaluación Docente</h1>
    <span style="font-size:0.85rem; color:#718096;" id="label-grado"></span>
  </div>
  <button class="btn-salir" onclick="cerrarSesion()">Cerrar sesión</button>
</header>

<main id="main-content">
  <div class="cargando">Cargando materias...</div>
</main>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycby1GqAiy__M9gKlcKUvDFvCRmACQX7A-SJCGwo-5AOY01387MNqbbAdst_bgQ-W1p0O/exec';

  const grado   = sessionStorage.getItem('eval_grado');
  const nombre  = sessionStorage.getItem('eval_nombre');
  const rol     = sessionStorage.getItem('eval_rol');

  if (!grado) window.location.href = '../index.html';

  document.getElementById('label-grado').textContent = `Grado: ${grado}`;

  const PREGUNTAS = [
    { id:'q1', texto:'My teacher explains things clearly.',                          categoria:'claridad'   },
    { id:'q2', texto:'My teacher is knowledgeable about the subject.',               categoria:'claridad'   },
    { id:'q3', texto:'The feedback I receive helps me improve.',                     categoria:'claridad'   },
    { id:'q4', texto:'I feel respected and valued in this class.',                   categoria:'ambiente'   },
    { id:'q5', texto:'I feel comfortable asking questions or sharing my ideas.',     categoria:'ambiente'   },
    { id:'q6', texto:'This class is well organized and focused.',                    categoria:'ambiente'   },
    { id:'q7', texto:'My teacher makes the class interesting and engaging.',         categoria:'engagement' },
    { id:'q8', texto:'I feel appropriately challenged in this class.',               categoria:'engagement' },
  ];

  const SEMESTRE_ACTUAL = (() => {
    const hoy = new Date();
    const anio = hoy.getFullYear();
    const mes  = hoy.getMonth() + 1;
    return mes <= 6 ? `${anio}-1` : `${anio}-2`;
  })();

  let asignaciones = [];
  let materiaActual = 0;
  let respuestas = {};   // { index: { q1..q8, comentario } }

  async function iniciar() {
    const data = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ accion: 'obtenerAsignaciones' })
    }).then(r => r.json());

    asignaciones = (data.asignaciones || []).filter(a => a.grado === grado);

    if (asignaciones.length === 0) {
      document.getElementById('main-content').innerHTML = `
        <div class="card" style="text-align:center; padding:3rem;">
          <div style="font-size:2.5rem; margin-bottom:1rem;">📭</div>
          <h2 style="font-size:1.1rem; color:#2d3748; margin-bottom:0.5rem;">No hay materias asignadas</h2>
          <p style="color:#718096;">No se encontraron materias para el grado <strong>${grado}</strong>.<br>Contacta a tu advisor.</p>
        </div>`;
      return;
    }

    // Inicializar respuestas vacías
    asignaciones.forEach((_, i) => { respuestas[i] = {}; });
    renderFormulario();
  }

  function renderFormulario() {
    const asig   = asignaciones[materiaActual];
    const total  = asignaciones.length;
    const rActual = respuestas[materiaActual] || {};
    const pct    = Math.round((materiaActual / total) * 100);

    const iconos = { Mathematics:'🔢', English:'📖', Science:'🔬', History:'🏛️',
                     Physics:'⚛️', Chemistry:'⚗️', Biology:'🧬', Spanish:'✍️',
                     'P.E.':'⚽', Art:'🎨', Music:'🎵', default:'📚' };
    const icono  = iconos[asig.materia] || iconos.default;

    const preguntasHTML = PREGUNTAS.map((p, pi) => {
      const val = rActual[p.id] || 0;
      const categoriaLabel = { claridad:'Clarity', ambiente:'Environment', engagement:'Engagement' };
      return `
        <div class="pregunta">
          <div class="pregunta-numero">Question ${pi + 1}</div>
          <span class="categoria-label ${p.categoria}">${categoriaLabel[p.categoria]}</span>
          <div class="pregunta-texto">${p.texto}</div>
          <div class="escala">
            <span class="escala-extremo">Strongly<br>Disagree</span>
            <div class="escala-btns">
              ${[1,2,3,4,5].map(n => `
                <button class="escala-btn ${val === n ? 'selected' : ''}"
                  onclick="seleccionarRespuesta(${pi}, '${p.id}', ${n})">${n}</button>
              `).join('')}
            </div>
            <span class="escala-extremo">Strongly<br>Agree</span>
          </div>
        </div>`;
    }).join('');

    const esUltima   = materiaActual === total - 1;
    const todasResp  = PREGUNTAS.every(p => (rActual[p.id] || 0) > 0);

    document.getElementById('main-content').innerHTML = `
      <div class="progreso-wrapper">
        <div class="progreso-info">
          <span>Subject ${materiaActual + 1} of ${total}</span>
          <span>${pct}% complete</span>
        </div>
        <div class="progreso-barra">
          <div class="progreso-fill" style="width:${pct}%"></div>
        </div>
      </div>

      <div class="nota-inline">
        🔒 Your identity is not stored with your answers. This evaluation is completely anonymous.
      </div>

      <div class="card">
        <div class="card-header">
          <div class="materia-icono">${icono}</div>
          <div class="materia-info">
            <h2>${asig.materia}</h2>
            <p>Teacher: ${asig.maestro} &nbsp;·&nbsp; Grade: ${grado}</p>
          </div>
        </div>

        ${preguntasHTML}

        <div class="comentario-section">
          <label>What is one thing your teacher does well, and one thing that could improve? (optional)</label>
          <textarea id="comentario" placeholder="Write your comment here..."
            onchange="respuestas[${materiaActual}].comentario = this.value"
          >${rActual.comentario || ''}</textarea>
        </div>
      </div>

      <div class="nav-btns">
        <button class="btn-anterior" onclick="anterior()"
          ${materiaActual === 0 ? 'style="visibility:hidden"' : ''}>
          ← Previous
        </button>
        ${esUltima
          ? `<button class="btn-enviar" id="btn-accion" onclick="enviarTodo()" ${!todasResp ? 'disabled' : ''}>
               <div class="spinner" id="spinner"></div>
               <span id="btn-texto">✅ Submit evaluation</span>
             </button>`
          : `<button class="btn-siguiente" id="btn-accion" onclick="siguiente()" ${!todasResp ? 'disabled' : ''}>
               Next →
             </button>`
        }
      </div>
      ${!todasResp ? `<p style="text-align:right; font-size:0.78rem; color:#a0aec0; margin-top:0.5rem;">Answer all questions to continue.</p>` : ''}
    `;
  }

  function seleccionarRespuesta(piIndex, qid, valor) {
    if (!respuestas[materiaActual]) respuestas[materiaActual] = {};
    respuestas[materiaActual][qid] = valor;
    renderFormulario();
    // Scroll suave a la siguiente pregunta sin ir hasta arriba
    const btns = document.querySelectorAll('.escala-btn.selected');
    if (btns.length < PREGUNTAS.length) {
      const siguiente = document.querySelectorAll('.pregunta')[piIndex + 1];
      if (siguiente) siguiente.scrollIntoView({ behavior:'smooth', block:'center' });
    }
  }

  function siguiente() {
    materiaActual++;
    window.scrollTo({ top: 0, behavior:'smooth' });
    renderFormulario();
  }

  function anterior() {
    materiaActual--;
    window.scrollTo({ top: 0, behavior:'smooth' });
    renderFormulario();
  }

  async function enviarTodo() {
    const btn     = document.getElementById('btn-accion');
    const spinner = document.getElementById('spinner');
    const texto   = document.getElementById('btn-texto');
    btn.disabled  = true;
    spinner.style.display = 'block';
    texto.textContent = 'Sending...';

    let errores = 0;
    for (let i = 0; i < asignaciones.length; i++) {
      const asig = asignaciones[i];
      const r    = respuestas[i] || {};
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({
            accion:      'guardarEvaluacion',
            semestre:    SEMESTRE_ACTUAL,
            grado:       grado,           // solo grado, nunca nombre
            materia:     asig.materia,
            maestro:     asig.maestro,
            q1: r.q1||0, q2: r.q2||0, q3: r.q3||0, q4: r.q4||0,
            q5: r.q5||0, q6: r.q6||0, q7: r.q7||0, q8: r.q8||0,
            comentario: r.comentario || ''
          })
        });
        const data = await res.json();
        if (!data.ok) errores++;
      } catch(e) { errores++; }
    }

    if (errores === 0) {
      sessionStorage.removeItem('eval_grado');
      sessionStorage.removeItem('eval_nombre');
      sessionStorage.removeItem('eval_usuario');
      sessionStorage.removeItem('eval_rol');
      document.getElementById('main-content').innerHTML = `
        <div class="card">
          <div class="exito">
            <div class="icono">🎉</div>
            <h2>Thank you for your feedback!</h2>
            <p>Your evaluation has been submitted successfully.<br>
            Your responses are anonymous and will help improve teaching quality.</p>
            <button class="btn-volver" onclick="window.location.href='../index.html'">
              Return to portal
            </button>
          </div>
        </div>`;
    } else {
      btn.disabled = false;
      spinner.style.display = 'none';
      texto.textContent = '✅ Submit evaluation';
      alert(`There was an error submitting ${errores} evaluation(s). Please try again.`);
    }
  }

  function cerrarSesion() {
    sessionStorage.clear();
    window.location.href = '../index.html';
  }

  iniciar();
</script>
</body>
</html>
