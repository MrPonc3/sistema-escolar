<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evaluación Docente</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .wrapper {
      width: 100%;
      max-width: 420px;
      padding: 1rem;
    }
    .card {
      background: white;
      border-radius: 14px;
      padding: 2.5rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .logo {
      text-align: center;
      margin-bottom: 1.75rem;
    }
    .logo .icono { font-size: 2.5rem; }
    .logo h1 { font-size: 1.3rem; color: #1a202c; margin-top: 0.5rem; font-weight: 600; }
    .logo p  { font-size: 0.85rem; color: #718096; margin-top: 0.25rem; }

    .form-group { margin-bottom: 1rem; }
    label { display: block; font-size: 0.8rem; font-weight: 600; color: #4a5568; margin-bottom: 0.4rem; }
    input {
      width: 100%; padding: 0.65rem 1rem;
      border: 1px solid #cbd5e0; border-radius: 8px;
      font-size: 0.95rem; outline: none; transition: border-color 0.2s;
    }
    input:focus { border-color: #4299e1; }

    .btn-ingresar {
      width: 100%; padding: 0.75rem;
      background: #3182ce; color: white;
      border: none; border-radius: 8px;
      font-size: 1rem; font-weight: 600;
      cursor: pointer; margin-top: 0.25rem;
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
      transition: background 0.2s;
    }
    .btn-ingresar:hover { background: #2b6cb0; }
    .btn-ingresar:disabled { background: #a0aec0; cursor: not-allowed; }

    .nota-privacidad {
      margin-top: 1.5rem;
      background: #f0fff4;
      border: 1px solid #9ae6b4;
      border-radius: 8px;
      padding: 0.85rem 1rem;
      font-size: 0.82rem;
      color: #276749;
      line-height: 1.6;
    }
    .nota-privacidad strong { display: block; margin-bottom: 0.2rem; }

    .error {
      background: #fff5f5; border: 1px solid #fc8181;
      border-radius: 8px; padding: 0.65rem 1rem;
      color: #c53030; font-size: 0.85rem;
      margin-top: 0.75rem; display: none;
    }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: white; border-radius: 50%;
      animation: spin 0.7s linear infinite; display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .volver {
      text-align: center; margin-top: 1.25rem;
      font-size: 0.82rem; color: #718096;
    }
    .volver a { color: #3182ce; text-decoration: none; }
    .volver a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="card">
      <div class="logo">
        <div class="icono">📝</div>
        <h1>Evaluación Docente</h1>
        <p>High School — Semestral</p>
      </div>

      <div class="form-group">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" placeholder="Tu usuario escolar" autocomplete="off">
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••">
      </div>

      <button class="btn-ingresar" id="btn-ingresar" onclick="iniciarSesion()">
        <div class="spinner" id="spinner"></div>
        <span id="btn-texto">Ingresar</span>
      </button>

      <div class="error" id="error-msg"></div>

      <div class="nota-privacidad">
        <strong>🔒 Tu privacidad está protegida</strong>
        Aunque inicias sesión para identificar tu grado, tu nombre
        <strong>nunca se guarda</strong> junto con tus respuestas.
        El formulario es completamente anónimo.
      </div>

      <div class="volver">
        <a href="../index.html">← Volver al portal principal</a>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycby1GqAiy__M9gKlcKUvDFvCRmACQX7A-SJCGwo-5AOY01387MNqbbAdst_bgQ-W1p0O/exec';

    // Si ya hay sesión activa de evaluación, redirigir directo al formulario
    if (sessionStorage.getItem('eval_grado')) {
      window.location.href = 'formulario/index.html';
    }

    async function iniciarSesion() {
      const usuario  = document.getElementById('usuario').value.trim();
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('error-msg');
      const btn      = document.getElementById('btn-ingresar');
      const spinner  = document.getElementById('spinner');
      const texto    = document.getElementById('btn-texto');

      if (!usuario || !password) {
        errorDiv.textContent = 'Por favor ingresa tu usuario y contraseña.';
        errorDiv.style.display = 'block'; return;
      }

      btn.disabled = true;
      spinner.style.display = 'block';
      texto.textContent = 'Verificando...';
      errorDiv.style.display = 'none';

      try {
        const res  = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ accion: 'login', usuario, password })
        });
        const data = await res.json();

        if (data.ok) {
          // Buscar el grado del alumno
          const resA = await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({ accion: 'obtenerAlumnos' })
          });
          const dataA = await resA.json();
          const alumno = (dataA.alumnos || []).find(a =>
            a.correo_alumno === usuario ||
            `${a.nombre}.${a.apellido}`.toLowerCase() === usuario.toLowerCase() ||
            `${a.nombre}${a.apellido}`.toLowerCase() === usuario.toLowerCase()
          );

          // Guardar solo grado y nombre para mostrar — nunca se envía al guardar
          sessionStorage.setItem('eval_grado',  alumno ? alumno.grado : data.rol === 'admin' || data.rol === 'advisor' ? 'staff' : '');
          sessionStorage.setItem('eval_nombre', alumno ? `${alumno.nombre} ${alumno.apellido}` : data.nombre);
          sessionStorage.setItem('eval_usuario', usuario);
          sessionStorage.setItem('eval_rol',    data.rol);

          window.location.href = 'formulario/index.html';
        } else {
          errorDiv.textContent = 'Usuario o contraseña incorrectos.';
          errorDiv.style.display = 'block';
        }
      } catch(e) {
        errorDiv.textContent = 'Error de conexión. Intenta de nuevo.';
        errorDiv.style.display = 'block';
      }

      btn.disabled = false;
      spinner.style.display = 'none';
      texto.textContent = 'Ingresar';
    }

    document.addEventListener('keypress', e => {
      if (e.key === 'Enter') iniciarSesion();
    });
  </script>
</body>
</html>
