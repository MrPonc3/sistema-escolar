<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Escolar — Inicio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: white;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .logo { font-size: 2.5rem; margin-bottom: 0.5rem; }
    h1 { font-size: 1.4rem; color: #1a202c; margin-bottom: 0.25rem; }
    .subtitle { color: #718096; font-size: 0.9rem; margin-bottom: 2rem; }
    .form-group { text-align: left; margin-bottom: 1rem; }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: #4a5568; margin-bottom: 0.4rem; }
    input {
      width: 100%; padding: 0.65rem 1rem;
      border: 1px solid #cbd5e0; border-radius: 8px;
      font-size: 1rem; outline: none; transition: border-color 0.2s;
    }
    input:focus { border-color: #4299e1; }
    button {
      width: 100%; padding: 0.75rem;
      background: #3182ce; color: white;
      border: none; border-radius: 8px;
      font-size: 1rem; font-weight: 600;
      cursor: pointer; margin-top: 0.5rem;
      transition: background 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    }
    button:hover { background: #2b6cb0; }
    button:disabled { background: #a0aec0; cursor: not-allowed; }
    .error { color: #e53e3e; font-size: 0.85rem; margin-top: 0.75rem; display: none; }
    .version { margin-top: 2rem; font-size: 0.75rem; color: #a0aec0; }
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🏫</div>
    <h1>Sistema de Intervención</h1>
    <p class="subtitle">Ingresa tus credenciales para continuar</p>

    <div class="form-group">
      <label for="usuario">Usuario</label>
      <input type="text" id="usuario" placeholder="usuario" autocomplete="off">
    </div>
    <div class="form-group">
      <label for="password">Contraseña</label>
      <input type="password" id="password" placeholder="••••••••">
    </div>

    <button id="btn-login" onclick="iniciarSesion()">
      <div class="spinner" id="spinner"></div>
      <span id="btn-texto">Ingresar</span>
    </button>
    <p class="error" id="error-msg">Usuario o contraseña incorrectos.</p>
    <p class="version">v0.2 — conectado a Google Sheets</p>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycby1GqAiy__M9gKlcKUvDFvCRmACQX7A-SJCGwo-5AOY01387MNqbbAdst_bgQ-W1p0O/exec';

    async function iniciarSesion() {
      const usuario  = document.getElementById('usuario').value.trim();
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('error-msg');
      const btn      = document.getElementById('btn-login');
      const spinner  = document.getElementById('spinner');
      const btnTexto = document.getElementById('btn-texto');

      if (!usuario || !password) {
        errorMsg.textContent = 'Por favor ingresa usuario y contraseña.';
        errorMsg.style.display = 'block';
        return;
      }

      // Mostrar cargando
      btn.disabled = true;
      spinner.style.display = 'block';
      btnTexto.textContent = 'Verificando...';
      errorMsg.style.display = 'none';

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ accion: 'login', usuario, password })
        });
        const data = await res.json();

        if (data.ok) {
          sessionStorage.setItem('usuario', usuario);
          sessionStorage.setItem('rol', data.rol);
          sessionStorage.setItem('nombre', data.nombre);
          if (data.rol === 'maestro')  window.location.href = 'maestro/index.html';
          if (data.rol === 'advisor')  window.location.href = 'advisor/index.html';
          if (data.rol === 'admin')    window.location.href = 'admin/index.html';
        } else {
          errorMsg.textContent = 'Usuario o contraseña incorrectos.';
          errorMsg.style.display = 'block';
        }
      } catch(err) {
        errorMsg.textContent = 'Error de conexión. Intenta de nuevo.';
        errorMsg.style.display = 'block';
      }

      btn.disabled = false;
      spinner.style.display = 'none';
      btnTexto.textContent = 'Ingresar';
    }

    document.addEventListener('keypress', e => {
      if (e.key === 'Enter') iniciarSesion();
    });
  </script>
</body>
</html>
